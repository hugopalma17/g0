<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link href="/static/css/output.css" rel="stylesheet" />
    <link href="/static/css/fonts.css" rel="stylesheet" />
    <link href="/static/css/theme.css?v=2" rel="stylesheet" />
</head>

<body data-theme="{{.Theme}}"
    style="font-family: 'Inter', sans-serif; background-color: var(--bg-primary); color: var(--text-primary); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="text-center px-4">
        <h1 class="text-8xl font-bold mb-4" style="color: var(--text-primary);">404</h1>
        <p class="text-xl mb-6" style="color: var(--text-secondary);">Page not found</p>
        <p class="mb-8 max-w-md mx-auto" style="color: var(--text-muted);">
            The page you're looking for doesn't exist or has been moved.
        </p>
        <a href="/" class="btn-primary">
            Back to Home
        </a>
    </div>
</body>

</html>
