{{define "content"}}
<section class="max-w-4xl">
  {{if .Content}}
  <div class="prose max-w-none">
    {{.Content}}
  </div>
  {{else}}
  <div class="prose max-w-none">
    <h2>Resume</h2>
    <p>Add your resume content in the admin panel by creating a <strong>resume</strong> entry.</p>
    <p>You can use Markdown or HTML to structure sections such as experience, skills, and education.</p>
  </div>
  {{end}}
</section>
{{end}}
